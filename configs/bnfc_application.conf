# BNFC settings of the ERA5 application (Section 5.2), sourced by run_application.sh.
# BNFC (nonstat): the configuration with the highest full-grid log score on the 365 validation
# days of 2022 (fits to 1994-2021; experiments/bnfc_app/summary.csv, tag r1_h128_lin_exp,
# selected by run_bnfc_app_tuning.sh), refitted to all 10,591 training days:
#   g(v,s): 4 hidden layers of width 128, GELU, linear output
#   Gaussian component: exponential correlation; log-normal variational distribution for the
#   range (started at 0.3), point estimate of the nugget (started at 0.057)
#   Adam, lr 1e-3 halved every 20 epochs, at most 150 epochs, early stopping after 15 epochs;
#   M2 = 5; pSGLD with 20 weight samples; seed 123
BNFC_APP_NONSTAT="--learn_cov --vb_range --kernel exponential --init_lengthscale 0.3 \
  --init_nugget 0.057 --hidden 128 --depth 4 --out_act linear --epochs 150 --patience 15 \
  --lr 1e-3 --step_size 20 --M2 5 --sgmcmc_samples 20 --seed 123"
