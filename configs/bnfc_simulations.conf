# BNFC settings of the simulation study (Section 5.1, Table 1), sourced by run_simulations.sh.
#
# Every fit:   2,000 training replicates, mini-batches of 20, pSGLD with 20 weight samples, one
#              every 50 iterations; seed 123. Gaussian component fixed at that of the
#              data-generating process (SE, range 0.1, nugget 1e-4); g(v): 2 hidden layers of
#              width 32, ReLU (fixed in utils.py).
# Default:     Adam, lr 1e-3 halved every 20 epochs, at most 100 epochs, early stopping after 25
#              epochs without an improvement of the ELBO per replicate of 0.01; M1 = 100, M2 = 50,
#              pSGLD step 1e-3; g(v,s): 3 hidden layers of width 64, GELU, softplus output.
# Tuned:       BNFC (stat) in scenario (i) and BNFC (nonstat) in scenarios (ii) and (iii) use the
#              configuration with the highest full-grid validation log score
#              (run_bnfc_sim_tuning.sh; experiments/bnfc_sim/validation_summary.csv and selected.csv,
#              Section S6.8 and Table S7 of the supplement). The other three fits use the default.
# Options given later override earlier ones, so the tuned settings are appended to the common ones.
BNFC_SIM_COMMON="--N 2000 --batch_size 20 --sgmcmc_samples 20 --sgmcmc_thin 50 --seed 123"
BNFC_SIM_DEFAULT="--epochs 100 --patience 25 --min_delta 0.01 --lr 1e-3 --step_size 20 --gamma 0.5 \
  --M1 100 --M2 50 --sgmcmc_step 1e-3"
BNFC_SIM_NONSTAT_NET="--hidden 64 --depth 3 --out_act softplus"

# <scenario>/<factor> -> Train_BNFC.py options (added to BNFC_SIM_COMMON)
declare -A BNFC_SIM=(
  # (i) gamma factor
  # stat: tuned, s8_M1_300_lr3e-3
  [simulations_gamma/stat]="--epochs 200 --patience 60 --min_delta 0.001 --lr 3e-3 --step_size 40 \
    --gamma 0.5 --M1 300 --M2 50 --sgmcmc_step 1e-3"
  [simulations_gamma/nonstat]="$BNFC_SIM_DEFAULT $BNFC_SIM_NONSTAT_NET"
  # (ii) sign change
  [simulations_signchange/stat]="$BNFC_SIM_DEFAULT"
  # nonstat: tuned, n5_lr3e-3
  [simulations_signchange/nonstat]="--patience 40 --min_delta 0.001 --gamma 0.5 --M2 50 \
    --sgmcmc_step 1e-3 --epochs 200 --lr 3e-3 --step_size 40 --M1 100 $BNFC_SIM_NONSTAT_NET"
  # (iii) regional mixture
  [simulations_mixgamma/stat]="$BNFC_SIM_DEFAULT"
  # nonstat: tuned, n6_M1_200 (mini-batches of 10 to fit in 24 GB of GPU memory)
  [simulations_mixgamma/nonstat]="--patience 40 --min_delta 0.001 --gamma 0.5 --M2 50 \
    --sgmcmc_step 1e-3 --epochs 200 --lr 1e-3 --step_size 40 --M1 200 $BNFC_SIM_NONSTAT_NET \
    --batch_size 10"
)
